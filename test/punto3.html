<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv="refresh" content="5">
  <title>SELECTOR DE COLOR RGB</title>
  <style>
    body {  
            text-align: center;
            background-color: black;
            color: white;
         }

    .botones{
        display: flex;
        justify-content: center;
    }
    .rojo{
        border-radius: 50%;
        width: 80px;
        height: 80px;
        border: 3px;
        border-color: white;
        background-color: red;
    }
    .apagado{
        border-radius: 50%;
        width: 80px;
        height: 80px;
        border: 3px;
        border-color: white;
        background-color: #34495e;
    }
    .verde{
        border-radius: 50%;
        width: 80px;
        height: 80px;
        border: 3px;
        border-color: white;
        background-color: green;
    }
    .azul{
        border-radius: 50%;
        width: 80px;
        height: 80px;
        border: 3px;
        border-color: white;
        background-color: blue;
    }
    .blanco{
        border-radius: 50%;
        width: 80px;
        height: 80px;
        border: 3px;
        border-color: white;
        background-color: white;
    }
  </style>
</head>
<body>
    <h1 class="titulo">Selector de Color RGB</h1>
    <span class="color">Color Actual: __COLOR_ACTUAL__</span>
    <div class="botones">
        <button class="botones rojo"><a href="/rojo">Rojo</a></button>
        <button class="botones verde"><a href="/verde">Verde</a></button>
        <button class="botones azul"><a href="/azul">Azul</a></button>
        <button class="botones blanco"><a href="/blanco">Blanco</a></button>
        <button class="botones apagado"><a href="/apagado">Apagado</a></button>
    </div>
</body>
</html>
